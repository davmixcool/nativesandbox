name: Images

# Builds images/<name> for amd64 and arm64 on native runners (emulating arm64 makes the Chromium install crawl),
# publishes one multi-arch tag per image at the package version, then runs test/images.test.ts against the
# published images on both architectures.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: davmixcool

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # DEFAULT_IMAGES points at the package version, so a tag that disagrees would publish images nothing uses.
      - if: startsWith(github.ref, 'refs/tags/')
        run: test "v${{ steps.read.outputs.version }}" = "${GITHUB_REF_NAME}"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        image: [node-python, media, browser]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/nativesandbox-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [node-python, media, browser]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: /tmp/digests
        run: |
          repo="${REGISTRY}/${OWNER}/nativesandbox-${{ matrix.image }}"
          docker buildx imagetools create -t "${repo}:${{ needs.version.outputs.version }}" \
            $(printf "${repo}@sha256:%s " *)
          docker buildx imagetools inspect "${repo}:${{ needs.version.outputs.version }}"

  smoke:
    needs: [version, publish]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # A new package starts private, so the smoke test logs in rather than depend on it being public yet.
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run test/images.test.ts
        env:
          NATIVESANDBOX_IMAGE_TAG: ${{ needs.version.outputs.version }}
